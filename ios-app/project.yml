name: TariffBuddy
options:
  bundleIdPrefix: com.wildrose
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Tariff Buddy"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_NSCameraUsageDescription: "Tariff Buddy needs camera access to scan product barcodes."
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: W6W5596HVA
    CODE_SIGN_STYLE: Automatic

targets:
  TariffBuddy:
    type: application
    platform: iOS
    sources:
      - path: TariffBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wildrose.tariffbuddy
        DEVELOPMENT_TEAM: W6W5596HVA
        CODE_SIGN_STYLE: Automatic
